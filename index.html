<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Kitón Family - ¡Diversión para toda la familia!</title>
    <link rel="stylesheet" href="style.css">
    <!-- API DE YOUTUBE -->
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

    <!-- PANTALLA DE CARGA -->
    <div id="loading-screen">
        <div id="loading-content">
            <div id="loading-logo-wrapper">
                <img id="loading-logo" src="logo_kiton_family.png" alt="Kitón Family">
            </div>
            <div id="welcome-title">¡Bienvenidos a la diversión familiar! 🐾</div>
            <div id="loading-bar-container">
                <div id="loading-bar"></div>
            </div>
            <div id="loading-text">Cargando...</div>
        </div>
        <button id="start-btn">▶ ¡Comenzar Kitón Family!</button>
    </div>

    <!-- LOGO Y PARTÍCULAS -->
    <div id="logo-container">
        <img id="logo-img" src="logo_kiton_family_1.png" alt="Kitón Family">
        <div id="particles-container"></div>
    </div>

    <!-- MASCOTA GATITO -->
    <div id="cat-mascot">
        <img src="gatito_mascota.png" alt="Mascota Kitón">
    </div>

    <!-- REPRODUCTOR GENERAL DE YOUTUBE -->
    <div id="player"></div>

    <script src="app.js"></script>
</body>
</html>
