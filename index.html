<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitón Family - ¡Televisión Kawaii!</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

    <!-- AVISO DE AUDIO -->
    <div id="unmute-banner">🔊 Haz clic en cualquier lugar para activar el sonido</div>

    <!-- PANTALLA DE CARGA -->
    <div id="loading-screen">
        <div id="loading-content">
            <div id="loading-logo-wrapper">
                <img id="loading-logo" src="logo_kiton_family.png" alt="Kitón Family">
            </div>
            <div id="welcome-title">¡Sintonizando Kitón Family! 🐾📺</div>
            <div id="loading-bar-container">
                <div id="loading-bar"></div>
            </div>
            <div id="loading-text">Cargando señal... 📡</div>
        </div>
    </div>

    <!-- LOGO Y PARTÍCULAS -->
    <div id="logo-container">
        <img id="logo-img" src="logo_kiton_family_1.png" alt="Kitón Family">
        <div id="particles-container"></div>
    </div>

    <!-- MASCOTA GATITO -->
    <div id="cat-mascot">
        <img src="gatito_mascota.png" alt="Mascota Kitón">
    </div>

    <!-- REPRODUCTOR ENVOLVENTE SIN BORDES -->
    <div id="player-container">
        <div id="player"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
